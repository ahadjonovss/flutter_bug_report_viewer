<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>flutter_bug_report viewer — parser tests</title>
<!--
  The same assertions test/run.js runs, in the engine the viewer will
  actually run in. Worth having separately: DecompressionStream and
  TextDecoder are host features, and node's are not the ones a reader
  will be using.

  Served, not opened from the file system — fetch cannot read file://
  URLs:

      python3 -m http.server 8000
      open http://localhost:8000/test.html

  This page carries no Content-Security-Policy, unlike index.html. It
  has to fetch the fixtures to test anything, and connect-src 'none'
  would stop it. Nothing here ships.
-->
<style>
  :root {
    --bg: #0E1116;
    --surface: #171B22;
    --border: #252B35;
    --text: #DCE1E8;
    --dim: #707A88;
    --pass: #4E9A6A;
    --fail: #E5544B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 24px 64px;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.6 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  main { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  .lead { color: var(--dim); margin: 0 0 28px; }
  .tally {
    position: sticky; top: 0;
    margin: 0 0 24px;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-weight: 600;
  }
  .tally.is-pass { color: var(--pass); }
  .tally.is-fail { color: var(--fail); }
  h2 {
    font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .08em;
    color: var(--dim);
    margin: 28px 0 8px;
  }
  .case { display: flex; gap: 10px; padding: 2px 0; }
  .case__mark { flex: none; width: 1em; }
  .case--pass .case__mark { color: var(--pass); }
  .case--fail .case__mark { color: var(--fail); }
  .case--fail { color: var(--fail); }
  .case__why {
    display: block; color: var(--dim);
    white-space: pre-wrap; word-break: break-word;
    padding-left: 0; margin-top: 2px;
  }
</style>
</head>
<body>
<main>
  <h1>flutter_bug_report viewer — parser tests</h1>
  <p class="lead">parse.js and unzip.js, against the golden bundles the package's own builder wrote.</p>
  <p class="tally" id="tally">running…</p>
  <div id="out"></div>
</main>

<script src="unzip.js"></script>
<script src="parse.js"></script>
<script src="test/cases.js"></script>
<script>
(function () {
  "use strict";

  function load(name) {
    return fetch("test/fixtures/" + name).then(function (response) {
      if (!response.ok) throw new Error("could not read fixture " + name + " (" + response.status + ")");
      return response.arrayBuffer();
    }).then(function (buffer) {
      return new Uint8Array(buffer);
    });
  }

  var out = document.getElementById("out");
  var tally = document.getElementById("tally");

  function line(parent, className, mark, what, why) {
    var row = document.createElement("div");
    row.className = "case case--" + className;

    var glyph = document.createElement("span");
    glyph.className = "case__mark";
    glyph.textContent = mark;
    row.appendChild(glyph);

    var body = document.createElement("span");
    body.textContent = what;

    if (why) {
      var reason = document.createElement("small");
      reason.className = "case__why";
      reason.textContent = why;
      body.appendChild(reason);
    }

    row.appendChild(body);
    parent.appendChild(row);
  }

  window.FBRTests.run(load).then(function (t) {
    var failed = t.results.filter(function (r) { return r.error; });
    var group = null;

    t.results.forEach(function (r) {
      if (r.group !== group) {
        group = r.group;
        var heading = document.createElement("h2");
        heading.textContent = group;
        out.appendChild(heading);
      }

      line(out, r.error ? "fail" : "pass", r.error ? "✗" : "✓", r.what, r.error);
    });

    tally.className = "tally " + (failed.length ? "is-fail" : "is-pass");
    tally.textContent =
      (t.results.length - failed.length) + " of " + t.results.length + " passed" +
      (failed.length ? ", " + failed.length + " failed" : "");
  }, function (error) {
    tally.className = "tally is-fail";
    tally.textContent = "the run itself broke: " + (error && error.message || error);
  });
})();
</script>
</body>
</html>
